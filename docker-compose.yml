services:
  db:
    image: postgres:16-alpine
    container_name: ml_prediction_postgres
    environment:
      POSTGRES_DB: ml_prediction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ml_prediction"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ml_prediction_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ml_prediction
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
